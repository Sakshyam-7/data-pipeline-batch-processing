version: 2

models:
  - name: dim_listings
    description: "Cleaned dimension table containing static property details."
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null

  - name: dim_hosts
    description: "SCD Type 2 dimension table tracking host history over time."
    columns:
      - name: host_id
        data_tests:
          - not_null
      - name: dbt_scd_id 
        data_tests:
          - unique
          - not_null

  - name: fact_bookings
    description: "Incremental fact table containing all booking events and revenue metrics."
    columns:
      - name: booking_id
        data_tests:
          - unique
          - not_null
      
      - name: listing_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: listing_id
              
      - name: booking_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['CONFIRMED', 'CANCELLED']

  - name: obt_bookings
    description: "One Big Table combining bookings, listings, and historical host attributes for BI dashboards."
    columns:
      - name: booking_id
        description: "The primary key for the booking transaction."
        tests:
          - unique
          - not_null

      - name: listing_id
        description: "Foreign key to the listing."
        tests:
          - not_null

      - name: booking_amount
        description: "Total amount paid for the booking."
        tests:
          - not_null

      - name: booking_status
        description: "Current status of the booking."
        tests:
          - accepted_values:
             arguments:
              values: ['CONFIRMED', 'CANCELLED']