version: 2

models:
  - name: dim_listings
    description: "Cleaned dimension table containing static property details."
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null

  - name: dim_hosts
    description: "SCD Type 2 dimension table tracking host history over time."
    columns:
      - name: host_id
        data_tests:
          - not_null
      - name: dbt_scd_id 
        data_tests:
          - unique
          - not_null
      # If you included dbt_scd_id in your SELECT statement, you can test it for uniqueness here!

  - name: fct_bookings
    description: "Incremental fact table containing all booking events and revenue metrics."
    columns:
      - name: booking_id
        data_tests:
          - unique
          - not_null
      
      - name: listing_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_listings')
              field: listing_id
              
      - name: booking_status
        data_tests:
          - accepted_values:
              values: ['CONFIRMED', 'CANCELLED']