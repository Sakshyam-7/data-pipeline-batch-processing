version: 2

models:
  - name: stg_bookings
    columns:
      - name: booking_id
        data_tests:
          - unique
          - not_null
      - name: listing_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_listings')
              field: listing_id
      - name: booking_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['CONFIRMED','CANCELLED'] 

  - name: stg_hosts
    columns:
      - name: host_id
        data_tests:
          - unique
          - not_null

  - name: stg_listings
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null
      - name: host_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_hosts')
              field: host_id
      - name: room_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['ENTIRE HOME', 'PRIVATE ROOM']